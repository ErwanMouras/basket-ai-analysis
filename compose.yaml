services:
  viewer:
    image: vyneros-viewer:poc
    build:
      context: .
      dockerfile: deploy/Dockerfile.viewer
    ports: ["127.0.0.1:8766:8765"]
    volumes:
      - ./examples/demo/runs:/data/runs:ro
      - ./examples/demo/videos:/data/videos:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
