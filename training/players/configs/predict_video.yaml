video: /path/to/video.mp4
output: runs/players/video-example
model: yolo
variant: yolo26n
weights: models/players/yolo26n.pt
source_class: 0
device: cpu
precision: fp32
resolution: 640
score_floor: 0.001
score_threshold: 0.25
max_detections: 100
cpu_threads: 4
max_frames: null
codec: mp4v
court:
  enabled: false  # make calibrate-court after make setup-court
  weights: models/court/court_keypoints.pt
  device: cpu
  resolution: 640
  detect_every: 5
  footpoint: bbox  # ankles uses optional pose; both are ground-contact approximations
  auto_cuts: true  # Reset tracking and jersey evidence on detected cuts
  max_propagation_seconds: 0.5
  overlay: true
  minimap: true
tracking:
  enabled: true
  tracker: botsort  # botsort (camera motion compensation) or bytetrack
  track_high_thresh: 0.25
  track_low_thresh: 0.1
  new_track_thresh: 0.25
  track_buffer_seconds: 1.0
  match_thresh: 0.8
  fuse_score: false  # Preserve low-confidence recovery in the pinned backend
  gmc_method: sparseOptFlow  # botsort only; 'none' disables camera compensation
  reset_frames: []  # Known cuts: reset before these zero-based frames; IDs are not reused
pose:
  enabled: false  # Enable with make pose-players or --pose after setup-players-pose
  weights: models/players/rtmpose-m.onnx
  device: cpu  # Independent of detector device; cuda:0 requires the CUDA lock
  cpu_threads: 4
  batch_size: 16
  min_detection_confidence: 0.25
  keypoint_min_confidence: 0.3
  min_bbox_area: 256.0
  max_players: 32

jersey:
  enabled: false  # make predict-jersey enables tracking, pose and jersey OCR
  weights: models/jersey/parseq.pt  # explicit make setup-jersey first
  device: cpu  # keep GPU available for detection/pose; CUDA is opt-in
  cpu_threads: 2
  batch_size: 4  # enforced maximum, no asynchronous GPU queue
  crops_per_video_second: 8.0
  max_duty_cycle: 0.15  # OCR wall-time cooldown (including cold start)
  min_batch_interval_seconds: 0.1
  gpu_reserve_mb: 1024
  sample_interval_seconds: 0.1
  selection_window_seconds: 0.3
  read_interval_seconds: 0.75
  confirmed_interval_seconds: 3.0
  evidence_ttl_seconds: 12.0
  state_ttl_seconds: 10.0
  max_tracks: 64
  max_evidence: 8
  min_votes: 2
  min_agreement: 0.75
  min_ocr_confidence: 0.9
  min_detection_confidence: 0.4
  min_crop_width: 20
  min_crop_height: 24
  min_sharpness: 25.0
  min_contrast: 12.0
  max_overlap: 0.4
