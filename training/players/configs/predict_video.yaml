video: /path/to/video.mp4
output: runs/players/video-example
model: yolo
variant: yolo26n
weights: models/players/yolo26n.pt
source_class: 0
device: cpu
precision: fp32
resolution: 640
score_floor: 0.001
score_threshold: 0.25
max_detections: 100
cpu_threads: 4
max_frames: null
codec: mp4v
tracking:
  enabled: true
  tracker: botsort  # botsort (camera motion compensation) or bytetrack
  track_high_thresh: 0.25
  track_low_thresh: 0.1
  new_track_thresh: 0.25
  track_buffer_seconds: 1.0
  match_thresh: 0.8
  fuse_score: false  # Preserve low-confidence recovery in the pinned backend
  gmc_method: sparseOptFlow  # botsort only; 'none' disables camera compensation
  reset_frames: []  # Known cuts: reset before these zero-based frames; IDs are not reused
