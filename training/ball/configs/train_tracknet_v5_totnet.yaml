model: tracknet_v5_totnet
dataset: exports/ball/tracknet-totnet
output: runs/ball
epochs: 30
batch_size: 2
optimizer: AdamW
learning_rate: 0.0001
weight_decay: 0.01
seed: 53
device: cuda:0
precision: fp32
workers: 4
prefetch_factor: 2
pin_memory: true
cpu_threads: 4
deterministic: true
resume: null
mlflow_uri: sqlite:///mlflow.db
experiment: ball-training
max_train_batches: null
max_val_batches: null
profile_file: training/ball/configs/ball_training.yaml
profile: tracknet_v5_totnet
reference_root: .external/tracknet_v5
scheduler: cosine
min_learning_rate: 1.0e-06
grad_clip: 1.0
threshold: 0.5
tolerance_px: 4.0
augmentation:
  brightness:
    prob: 0.5
    max_delta: 40
  contrast:
    prob: 0.5
    range:
    - 0.6
    - 1.4
  hue_saturation:
    prob: 0.4
    hue_delta_deg: 12
    saturation_range:
    - 0.6
    - 1.5
  gaussian_noise:
    prob: 0.2
    sigma_range:
    - 2
    - 8
  motion_blur:
    prob: 0.25
    kernel_range:
    - 3
    - 9
  jpeg:
    prob: 0.3
    quality_range:
    - 40
    - 90
  occlusion:
    prob: 0.5
    patch_scale: 6
    fill: mean
    only_when_visible: true
  horizontal_flip:
    prob: 0.5
  zoom_crop:
    prob: 0.3
    scale_range:
    - 0.7
    - 1.0
