checkpoint: null
dataset: exports/ball/tracknet-totnet
output: runs/ball/evaluation
split: val
device: cuda:0
precision: fp32
batch_size: 2
workers: 4
prefetch_factor: 2
pin_memory: true
cpu_threads: 4
seed: 53
deterministic: true
